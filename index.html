    <!--
      First-paint theme. Without this the window is white until settings load
      from SQLite, then flips to the saved theme (the white-then-black flash).
      lib/theme/accent.ts's applyTheme() caches the resolved theme + accent
      variables in localStorage ("scc.theme"); this runs synchronously, before
      the first paint and before any app code, and re-applies them. First ever
      launch (no cache) falls back to the OS light/dark preference.
    -->
    <script>
      (function () {
        var r = document.documentElement;
        var c = null;
        // Parsing and applying fail independently: a corrupt or unreadable
        // cache must still fall through to the OS light/dark preference.
        try {
          c = JSON.parse(localStorage.getItem("scc.theme") || "null");
        } catch (e) {}
        if (!c || typeof c !== "object") c = null;
        try {
          var dark = c && c.mode !== "system" ? c.mode === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) r.classList.add("dark");
          if (c && c.vars) for (var k in c.vars) r.style.setProperty(k, c.vars[k]);
        } catch (e) {}
      })();
    </script>

    <!--
      Brand + splash styles, inline on purpose: in `tauri dev` Vite injects
      globals.css from JavaScript, so nothing else is styled yet when the
      window first appears. These are also the ONLY definition of .scc-logo,
      which the nav, onboarding and loading screens reuse.

      .scc-logo is the app logo drawn as a CSS mask filled with currentColor,
      so it follows the theme: a solid silhouette on light backgrounds, the
      shaded (bevelled) artwork on dark ones. The two 176px masks are embedded
      as data URIs (~30 KB) so the logo paints with the first frame, with no
      request. Source artwork + the generator live in architecture.md §A17.
    -->

      /* #root needs its height here too: globals.css sets it, but in `tauri dev`
         that file is injected by JavaScript, so without this the static splash
         would collapse to the top of the window until it arrives. */
      html, body, #root { height: 100%; margin: 0; background: var(--splash-bg); }

      .scc-logo {
        display: inline-block;
        flex: none;
        width: var(--s, 96px);
        height: var(--s, 96px);
        background-color: currentColor;
        -webkit-mask: var(--logo-mask) center / contain no-repeat;
        mask: var(--logo-mask) center / contain no-repeat;
      }

      .scc-splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--splash-bg);
        color: var(--splash-fg);
      }
      .scc-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(128, 128, 128, 0.28);
        border-top-color: var(--color-accent-text, #6189ff);
        animation: scc-spin 0.8s linear infinite;
      }
      @keyframes scc-spin { to { transform: rotate(360deg); } }
      @keyframes scc-pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .scc-spinner { animation: scc-pulse 1.6s ease-in-out infinite; border-color: var(--color-accent-text, #6189ff); }
      }
      .scc-sr {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <!-- Static copy of <SplashScreen /> (src/components/SplashScreen.tsx) so
         the loading screen is on screen before JavaScript has even loaded.
         React replaces it on mount with an identical one. Keep them in sync. -->
    <div id="root">
      <div class="scc-splash" role="status">
        <span class="scc-logo" style="--s: 96px" role="img" aria-label="Student Command Center"></span>
        <span class="scc-spinner" aria-hidden="true"></span>
        <span class="scc-sr">Loading Student Command Center…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
